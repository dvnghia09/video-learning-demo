<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        html { font-size: 18px; }
        body { font-family: 'Roboto', sans-serif; letter-spacing: 0.02em; }
    </style>

    <style>
        .zalo-floating-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .zalo-floating-btn {
                bottom: 16px;
                right: 16px;
            }
        }

        .zalo-icon-wrap {
            width: 45px;
            height: 45px;
            background-color: #0068ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: zalo-pulse 2s infinite;
        }

        .zalo-icon-wrap img {
            width: 35px;
            height: 35px;
            object-fit: contain;
            animation: zalo-shake 2s infinite ease-in-out;
        }

        @keyframes zalo-pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 104, 255, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 104, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 104, 255, 0); }
        }

        @keyframes zalo-shake {
            0%, 100% { transform: rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: rotate(-10deg) scale(1.1); }
            20%, 40%, 60%, 80% { transform: rotate(10deg) scale(1.1); }
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <nav class="bg-white shadow-md border-b border-gray-100 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="text-xl font-bold text-pink-500">FloralArt</a>
            </div>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-lg">
            <div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                    Đăng ký tài khoản
                </h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Bắt đầu hành trình nghệ thuật cắm hoa
                </p>
            </div>
            <form class="mt-8 space-y-6" action="index.html" method="GET">
                <div class="rounded-md shadow-sm space-y-4">
                    <div>
                        <label for="full-name" class="block text-lg font-bold text-gray-700 mb-2">Họ và tên <span class="text-red-500">*</span></label>
                        <input id="full-name" name="name" type="text" required class="appearance-none relative block w-full px-4 py-3 border-2 border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-pink-500 focus:border-pink-500 focus:z-10 text-lg" placeholder="Họ và tên">
                    </div>
                    <div>
                        <label for="phone-number" class="block text-lg font-bold text-gray-700 mb-2 mt-4">Số điện thoại <span class="text-red-500">*</span></label>
                        <input id="phone-number" name="phone" type="tel" pattern="[0-9]*" required class="appearance-none relative block w-full px-4 py-3 border-2 border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-pink-500 focus:border-pink-500 focus:z-10 text-lg" placeholder="Số điện thoại">
                    </div>
                    <div>
                        <label for="password" class="block text-lg font-bold text-gray-700 mb-2 mt-4">Mật khẩu <span class="text-red-500">*</span></label>
                        <input id="password" name="password" type="password" required class="appearance-none relative block w-full px-4 py-3 border-2 border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-pink-500 focus:border-pink-500 focus:z-10 text-lg" placeholder="Mật khẩu">
                    </div>
                    <div>
                        <label for="confirm-password" class="block text-lg font-bold text-gray-700 mb-2 mt-4">Xác nhận mật khẩu <span class="text-red-500">*</span></label>
                        <input id="confirm-password" name="confirm-password" type="password" required class="appearance-none relative block w-full px-4 py-3 border-2 border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-pink-500 focus:border-pink-500 focus:z-10 text-lg" placeholder="Xác nhận mật khẩu">
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-lg font-bold rounded-md text-white bg-pink-500 py-3 hover:bg-pink-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500">
                        Đăng ký
                    </button>
                </div>
                
                
                <div class="text-center mt-8 pt-6 border-t border-gray-200">
                    <p class="text-gray-600 mb-4 text-lg">Đã có tài khoản?</p>
                    <a href="login.html" class="inline-block w-full flex justify-center py-3 px-4 border-2 border-pink-500 text-pink-600 font-bold rounded-md hover:bg-pink-50 transition text-lg">
                        Đăng nhập ngay
                    </a>
                </div>

            </form>
        </div>
    </div>


    <!-- Floating Zalo -->
    <a href="https://zalo.me/0123456789" target="_blank" class="zalo-floating-btn">
        <div class="zalo-icon-wrap">
            <div style="color:white; font-weight:900; font-size:14px; font-family:Arial, sans-serif; letter-spacing:0.5px; animation: zalo-shake 2s infinite ease-in-out;">Zalo</div>
        </div>
    </a>
</body>
</html>
